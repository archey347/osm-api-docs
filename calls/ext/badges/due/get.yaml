kind: ext-action
method: GET
path: /ext/badges/due/
action: get
summary: List badges due to be awarded
description: "`get` lists completed badges that have not yet been awarded; `download` and `downloadBags` return documents instead of JSON."
tags: [ Badges ]
source:
  request: inferred
  response: inferred
query:
  section:
    type: string
    enum: [ squirrels, beavers, cubs, scouts, explorers ]
    description: Section type.
  sectionid:
    type: string
    description: Section ID.
  termid:
    type: string
    description: Term ID.
response:
  schema:
    $ref: BadgeDueResponse
  examples:
    get:
      summary: Due badges
      value:
        count: 1
        pending:
          "1001_0":
            - scout_id: 3100001
              firstname: Jamie
              lastname: River
              badge_id: 1001
              badge_version: 0
              badge_identifier: "1001_0"
              completed: 1
        description:
          "1001_0":
            name: Teamwork
sources: [ ext.badges.6a63e40102b2845e63ab.js ]
