kind: ext-action
method: GET
path: /ext/badges/records/
action: printBadge
summary: Print a badge record
description: "`printBadge` — downloads a printable badge record (document, not JSON)."
tags: [ Badges ]
source:
  request: inferred
  response: inferred
query:
  section:
    type: string
    enum: [ squirrels, beavers, cubs, scouts, explorers ]
    description: Section type.
  section_id:
    type: string
    description: "Section ID (used with `getAvailableBadges`)."
  term_id:
    type: string
    description: Term ID.
  type_id:
    type: string
    enum: [ "-1", "1", "2", "3", "4" ]
    description: Badge type ID. 1 = Challenge, 2 = Activity, 3 = Staged, 4 = Core, -1 = all types.
  badge_id:
    type: string
    description: "Badge ID (required for `getBadgeRecords`, `getEligibleMembers`, `getColumnsForBadge`)."
  badge_version:
    type: string
    description: "Badge version (required for `getBadgeRecords`, `getColumnsForBadge`)."
response:
  document: true
sources: [ ext.badges.6a63e40102b2845e63ab.js ]
