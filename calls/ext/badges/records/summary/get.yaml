kind: ext-action
method: GET
path: /ext/badges/records/summary/
action: get
summary: Get the badge summary by member
description: "`get` returns JSON; `printSummary` returns a document to download."
tags: [ Badges ]
source:
  request: inferred
  response: inferred
query:
  mode:
    type: string
    enum: [ verbose ]
  section:
    type: string
    enum: [ squirrels, beavers, cubs, scouts, explorers ]
    description: Section type.
  section_id:
    type: string
  term_id:
    type: string
  type_id:
    type: string
    description: Badge type ID.
response:
  schema:
    $ref: BadgeItemsResponse
  examples:
    get:
      summary: Summary
      value:
        items:
          - scout_id: 3100001
            firstname: Jamie
            lastname: River
            photo_guid: "00000000-0000-0000-0000-000000000000"
sources: [ ext.badges.6a63e40102b2845e63ab.js ]
