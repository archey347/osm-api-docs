kind: ext-action
method: GET
path: /ext/dashboard/
action: getNextThings
summary: Get upcoming items
description: "`getNextThings` is the section dashboard; `getGroupDashboard` and `memberSearch` serve the group dashboard across several sections."
tags: [ Dashboard ]
source:
  request: observed
  response: observed
  observed_on: 2026-10-05
query:
  sectionid:
    type: string
    description: "Section ID. Required by `getNextThings`."
  termid:
    type: string
    description: "Term ID. Required by `getNextThings`."
  section:
    type: string
    enum: [ squirrels, beavers, cubs, scouts, explorers ]
    description: "Section type. Required by `getNextThings`."
  parts:
    type: string
    enum: [ core, agenda, section_widgets, user_widgets ]
    description: "Limits the response to one group of widgets; the web app requests each separately. The response then has a `parts` array."
response:
