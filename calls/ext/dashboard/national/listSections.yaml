kind: ext-action
method: GET
path: /ext/dashboard/national/
action: listSections
summary: List sections
tags: [ Dashboard ]
source:
  request: inferred
  response: inferred
query:
  section_id:
    type: string
    description: "Section ID. `getSectionType` takes the section being looked up; `listGroups` and `listSections` take the caller's own section; `listRolesForSection` takes the section whose roles to list."
  group_id:
    type: string
    description: Limits results to one group.
  section:
    type: string
    description: Section type filter.
  includeInactive:
    type: string
    enum: [ "true" ]
response:
  schema:
    $ref: DashboardNationalSections
  examples:
    listSections:
      value:
        items:
          - sectionid: "45001"
            name: Cubs
            section_type: cubs
sources: [ ext.dashboard.82a61c008183022fe2cd.js, osm-de353b59e43da8164ac0b179aadfacd1.js ]
