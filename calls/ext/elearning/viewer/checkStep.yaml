kind: ext-action
method: POST
path: /ext/elearning/viewer/
action: checkStep
summary: Check a step's answers
description: "`startModule`, `checkStep` and `completeModule` change data."
tags: [ E-Learning ]
source:
  request: inferred
  response: inferred
body:
  params:
    section_id:
      type: string
      required: true
    module_id:
      type: string
      required: true
    run_id:
      type: string
      description: Sent once a run has started.
    demo:
      type: string
      enum: [ "true", "false" ]
      description: "Not sent by `completeModule`."
    step_id:
      type: string
    "answers[a{questionId}]":
      type: string
      description: "Answer text; checkbox questions send `answers[a{questionId}][{optionIndex}]` with each selected option instead."
  example:
    section_id: "45001"
    module_id: "7100001"
    run_id: "7400001"
    demo: "false"
    step_id: "7200001"
    "answers[a7300001]": "Yes"
response:
  schema:
    $ref: ELearningCheckStepResponseData
  envelope: true
  examples:
    checkStep:
      summary: "Answers checked; `meta.result` is true when all are correct"
      value:
        - question_id: "7300001"
          multi: false
          reason: ""
sources: [ area.elearning.78729e36e08410a6eaec.js ]
