kind: ext-action
method: GET
path: /ext/events/approvals/
action: getEvents
summary: List events by approval state
description: "`getEvents` lists events by approval state (backs the approvals pane), `getListOfApprovers` lists users an event can be assigned to, `getPendingEventCount` returns the pending count for the dashboard."
tags: [ Events ]
source:
  request: inferred
  response: inferred
query:
  section_id:
    type: string
    required: true
  type:
    type: string
    enum: [ pending, approved, rejected ]
  max_days:
    type: string
    description: "Only events starting within this many days; `-1` for all."
response:
  schema:
    $ref: EventApprovalList
  envelope: true
  examples:
    getEvents:
      value:
        - name: Summer Camp
          approval_requested_at: "2025-03-01"
          start_date: "2025-07-20"
          assigned_to: Alex Approver
          group: "1st Example"
          section: Example Scouts
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
