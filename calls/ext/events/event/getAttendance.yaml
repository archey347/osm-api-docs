kind: ext-action
method: GET
path: /ext/events/event/
action: getAttendance
summary: Get event attendance
tags: [ Events ]
source:
  request: inferred
  response: inferred
query:
  sectionid:
    type: string
    description: Section ID.
  eventid:
    type: string
    description: Event ID.
  termid:
    type: string
    description: Term ID.
  mode:
    type: string
    description: |-
      `getAttendance`: `section`, `public`, `campsite` or `item`.
      `downloadPdf`/`startSpreadsheet`: the members tab (`attendance`, `rota` or `payments`).
      `getPeopleWithQualification`: `mine`, `other` or `section`.
response:
  schema:
    $ref: EventAttendance
  examples:
    getAttendance:
      value:
        identifier: scoutid
        items:
          - scoutid: "3100001"
            firstname: Alex
            lastname: Scout
            patrolid: "8000001"
            attending: "Yes"
            f_1: Vegetarian
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
