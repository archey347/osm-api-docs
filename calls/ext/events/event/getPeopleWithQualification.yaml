kind: ext-action
method: GET
path: /ext/events/event/
action: getPeopleWithQualification
summary: List people holding a qualification
tags: [ Events ]
source:
  request: inferred
  response: inferred
query:
  section_id:
    type: string
    description: Section ID.
  event_id:
    type: string
    description: Event ID.
  mode:
    type: string
    description: |-
      `getAttendance`: `section`, `public`, `campsite` or `item`.
      `downloadPdf`/`startSpreadsheet`: the members tab (`attendance`, `rota` or `payments`).
      `getPeopleWithQualification`: `mine`, `other` or `section`.
  qualification_id:
    type: string
response:
  schema:
    $ref: EventQualificationPeopleData
  envelope: true
  examples:
    getPeopleWithQualification:
      value:
        - member_id: "3100002"
          name: Sam Leader
sources: [ ext.events.4fe61901f961aaf5b232.js, osm-de353b59e43da8164ac0b179aadfacd1.js ]
