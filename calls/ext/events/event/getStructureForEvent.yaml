kind: ext-action
method: GET
path: /ext/events/event/
action: getStructureForEvent
summary: Get an event's column structure
tags: [ Events ]
source:
  request: inferred
  response: inferred
query:
  sectionid:
    type: string
    description: Section ID.
  eventid:
    type: string
    description: Event ID.
response:
  schema:
    $ref: EventStructure
  examples:
    getStructureForEvent:
      value:
        eventid: "9600001"
        name: Summer Camp
        startdate: "2025-07-20"
        starttime: "09:00:00"
        enddate: "2025-07-27"
        endtime: "17:00:00"
        location: Example Campsite
        cost: "120.00"
        confdate: "2025-06-01"
        attendancelimit: "40"
        structure:
          - rows:
              - field: firstname
                name: First name
              - field: lastname
                name: Last name
              - field: attending
                name: Attending
                editable: true
                type: dojox.grid.cells.Select
                options: [ "Yes", "No", Invited, Show in My.SCOUT ]
          - rows:
              - field: f_1
                name: Dietary needs
                editable: true
        extra:
          sharing:
            sharee: false
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
