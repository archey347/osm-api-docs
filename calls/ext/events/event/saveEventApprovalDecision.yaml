    status: approved
    reason: ""
response:
  schema:
    $ref: EventApprovalDecisionData
  envelope: true
  examples:
    saveEventApprovalDecision:
      value:
        check:
          type: safeguarding
          status: approved
          reason: ""
          date_last_updated: "2025-03-03 10:00:00"
          moderator: Alex Approver
