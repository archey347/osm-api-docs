tags: [ Events ]
source:
  request: inferred
  response: inferred
body:
  params:
    event_id:
      type: string
    moderating_section_id:
      type: string
    check:
      type: string
      description: Approval check type.
    status:
      type: string
      enum: [ pending, approved, rejected ]
    reason:
      type: string
  example:
    moderating_section_id: "45001"
