kind: ext-action
method: POST
path: /ext/events/event/sharing/
action: share
summary: Share an event with sections
tags: [ Events ]
source:
  request: inferred
  response: inferred
body:
  params:
    sectionid:
      type: string
      description: Section ID.
    eventid:
      type: string
    targetSection:
      type: string
      description: Section being invited or messaged.
    eventname:
      type: string
    attendanceLimit:
      type: string
      description: "Per-section limit, `0` for none."
    limitleaders:
      type: string
      description: "`1` if the limit includes leaders."
    payments:
      type: string
      description: "JSON array of `{scheme, name, date, cost}`."
    auto_share:
      type: string
      enum: [ "0", "1" ]
    auto_invite:
      type: string
      enum: [ "0", "1" ]
    auto_invite_leaders:
      type: string
      enum: [ "0", "1" ]
    auto_share_hqpayments:
      type: string
      enum: [ "0", "1" ]
    hierarchy_id:
      type: string
    hierarchy_level:
      type: string
    hierarchy_section_type:
      type: string
  example:
    eventid: "9600001"
    sectionid: "45001"
    eventname: Summer Camp
    targetSection: "45002"
    attendanceLimit: "10"
    limitleaders: "0"
response:
  schema:
    $ref: EventSharingResult
  examples:
    share:
      value:
        sectionConfig: { }
    shareError:
      value:
        error: That section has already been invited.
