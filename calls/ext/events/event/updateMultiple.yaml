kind: ext-action
method: POST
path: /ext/events/event/
action: updateMultiple
summary: Update several members on an event
description: "`updateScout` takes `sectionid`/`eventid` in the body, `updateMultiple` takes `eventid` in the body and `sectionid` in either."
tags: [ Events ]
source:
  request: inferred
  response: unknown
query:
  sectionid:
    type: string
body:
  params:
    eventid:
      type: string
    value:
      type: string
      description: New value.
    scouts:
      type: string
      description: JSON array of member IDs.
    col:
      type: string
      description: "`invite`, `showinportal`, `payment` or a custom column key."
  example:
    eventid: "9600001"
    scouts: "[3100001,3100003]"
    col: invite
response:
  schema:
    anyOf:
      - $ref: EventAdded
      - $ref: EventColumns
      - $ref: EventScoutUpdate
      - $ref: EventLegacyOk
      - $ref: EventApprovalModeration
      - $ref: EventApprovalDecision
      - $ref: EventAttachments
      - $ref: EventPayload
