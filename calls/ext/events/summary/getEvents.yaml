kind: ext-action
method: GET
path: /ext/events/summary/
action: getEvents
summary: List events (lighter list)
description: "`get` lists the section's events for the term, `getEvents` a lighter list (`onlyArchived=1` for archived ones), `getAudit` recent attendance changes."
tags: [ Events ]
source:
  request: inferred
  response: inferred
query:
  sectionid:
    type: string
    required: true
  termid:
    type: string
  onlyArchived:
    type: string
    enum: [ "1" ]
response:
  schema:
    $ref: EventSummaryList
  examples:
    getEvents:
      value:
        items:
          - eventid: "9600001"
            name: Summer Camp
            startdate: "2025-07-20"
sources: [ ext.badges.6a63e40102b2845e63ab.js, ext.events.4fe61901f961aaf5b232.js ]
