kind: ext-action
method: POST
path: /ext/finances/invoices/
action: addInvoice
summary: Create an invoice
description: "`addInvoice` edits an existing invoice when `invoiceid` is sent."
tags: [ Finances ]
source:
  request: inferred
  response: inferred
query:
  sectionid:
    type: string
    description: Section ID.
body:
  params:
    name:
      type: string
      description: "Invoice name (max 64 characters; `addInvoice`) or budget name (`addNamedCategory`)."
    date:
      type: string
      format: date
    extra:
      type: string
      description: Invoice notes.
    invoiceid:
      type: string
  example:
    name: Summer camp
    date: "2024-07-20"
    extra: Notes
response:
  schema:
    $ref: FinanceInvoiceAdded
  examples:
    addInvoice:
      summary: addInvoice
      value:
        id: "9400001"
