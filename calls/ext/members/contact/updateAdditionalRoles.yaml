kind: ext-action
method: POST
path: /ext/members/contact/
action: updateAdditionalRoles
summary: Update a member's additional roles
description: "The `action` query parameter is `update`, or `updateAdditionalRoles` for a member's additional patrol/section roles."
tags: [ Members ]
source:
  request: inferred
  response: inferred
body:
  params:
    patrolleader:
      type: integer
      description: |-
        Required when `column=patrolid`. Rank level:
        0 = none, 1 = APL/Seconder, 2 = PL/Sixer, 3 = SPL/Senior Sixer.
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    comments:
      type: string
    member_id:
      type: string
    section_id:
      type: string
    term_id:
      type: string
    is_primary:
      type: string
      enum: [ "true", "false" ]
    remove:
      type: string
      description: "Role level (`patrolleader` value) to remove; sent instead of `patrolleader`."
  example:
    member_id: "3100001"
    section_id: "45001"
    term_id: "67890"
    patrolleader: 4
    start_date: "2024-09-01"
    comments: Covering for camp
    is_primary: "false"
response:
  schema:
    type: object
    properties:
      ok:
        type: boolean
      meta:
        type: object
        properties:
          last_updated:
            type: string
            description: "Timestamp of the update (e.g. `2025-09-15 19:42:10`)."
          last_updated_by_name:
            type: string
            description: Name of the user who made the update.
      error:
        description: "Set on failure; either a message string or an object with `message`."
    additionalProperties: true
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
