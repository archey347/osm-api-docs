kind: ext-action
method: POST
path: /ext/members/flexirecords/
action: editSet
summary: Edit a flexi-record
tags: [ Members ]
source:
  request: inferred
  response: inferred
query:
  sectionid:
    type: string
    description: Section ID.
  extraid:
    type: string
    description: Flexi-record ID.
body:
  params:
    name:
      type: string
      description: Up to 50 characters.
    type:
      type: string
      enum: [ none, maths, badge, both ]
      description: Total column type.
    dob:
      type: string
      description: "`1` to show date of birth; omitted otherwise."
    age:
      type: string
      description: "`1` to show age; omitted otherwise."
    patrol:
      type: string
      description: "`1` to show patrol; omitted otherwise."
response:
  schema:
    $ref: FlexiRecordStructure
  examples:
    structureChange:
      summary: "`editSet`, `addColumn`, `renameColumn`, `deleteColumn`: the updated structure"
      value:
        extraid: "23001"
        name: Hike Log
        archived: "0"
        total: none
        structure:
          - rows:
              - name: Age
                field: age
          - rows:
              - name: Distance (km)
                field: f_1
sources: [ ext.members.ca95317ad56b2f22a5e5.js ]
