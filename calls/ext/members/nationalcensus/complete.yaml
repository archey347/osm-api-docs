kind: ext-action
method: POST
path: /ext/members/nationalcensus/
action: complete
summary: Submit the national census
description: "`complete` with `checkOnly=true` validates without submitting."
tags: [ Members ]
source:
  request: inferred
  response: inferred
query:
  checkOnly:
    type: string
    enum: [ "true" ]
body:
  params:
    section_id:
      type: string
    members:
      type: string
      description: JSON array of member IDs.
  example:
    section_id: "45001"
    members: "[3100001,3100002]"
response:
  schema:
    $ref: CensusSubmitResult
  examples:
    complete:
      summary: "`complete`: failures set one of `available_members_changed`, `missing_info`"
      value:
        missing_info: true
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
