path: /ext/mymember/
method: POST
summary: Parent portal account and member linking
description: |-
  Account actions share this path with different `action` values.
  `register` and `resendGuid` are used on the login page before a session
  exists; `guid_expiry` is the opaque token from a parent invitation link.
  `getDetails` is the legacy pane base-class call and no current screen
  is known to use it.
response: |-
  Result of the account action. The web app only reads `status` (and `error.message` on failure),
  except `confirmCode`, whose `data` replaces the user's member access.
response_examples:
  error:
    summary: Failure
    value:
      status: false
      error:
        message: That code is not valid.
