kind: ext-action
method: GET
path: /ext/mymember/badges/
action: getBadgeRequirements
summary: 'Get a badge''s requirements and progress for a member'
description: "`getSummary` lists a member's badges with progress; `getBadgeRequirements` returns the requirements of one badge."
tags: [ Parent Portal ]
source:
  request: inferred
  response: inferred
query:
  section_id:
    type: string
    required: true
  member_id:
    type: string
    required: true
  badge_identifier:
    type: string
    description: "`badge_id_version`, for example `1234_1`."
response:
  schema:
    $ref: MyMemberBadgeRequirementsResponse
  examples:
    getBadgeRequirements:
      value:
        status: true
        error: null
        data:
          name: Camp Skills
          url: /images/badges/camp-skills.png
          awarded: ""
          description: Learn the basics of camping.
          label_mode: tick
          modules:
            - title: Module A
              letter: a
              required: 1
              columns:
                - column_id: 8801
                  text: Pitch a tent
                  tooltip: ""
                  checked: true
        meta:
          homework: true
          homework_introduction: ""
sources: [ ext.mymember.eb573b16408e09aef101.js ]
