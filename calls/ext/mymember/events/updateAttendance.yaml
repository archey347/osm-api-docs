source:
  request: inferred
  response: inferred
body:
  params:
    member_id:
      type: string
      required: true
    section_id:
      type: string
      required: true
    event_id:
      type: string
      required: true
    attendance:
      type: string
      description: "`yes` or `no`."
    "info[<name>]":
      type: string
      description: "One field per event column `name`."
