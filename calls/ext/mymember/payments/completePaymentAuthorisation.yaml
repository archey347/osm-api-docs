kind: ext-action
method: POST
path: /ext/mymember/payments/
action: completePaymentAuthorisation
summary: Complete a payment authorisation
description: "Card and direct debit set-up is a two-step flow: `getScheduledDirectDebitSetupUrl` returns the gateway URL (GoCardless) or client secret (Stripe), then `checkStatusOfDirectDebitSetup` (GoCardless, polled) or `completePaymentAuthorisation` (Stripe) finishes it."
tags: [ Parent Portal ]
source:
  request: inferred
  response: inferred
body:
  params:
    member_id:
      type: string
    section_id:
      type: string
    schedule_id:
      type: string
    payment_id:
      type: string
    key:
      type: string
      description: "The `key` returned by `getScheduledDirectDebitSetupUrl`."
    payment_identifier:
      type: string
      description: Stripe payment method ID from the completed card setup.
  example:
    member_id: "3100001"
    section_id: "45001"
    schedule_id: "6200001"
    payment_id: "6300001"
    key: example-setup-key
    payment_identifier: pm_example
response:
  schema:
    $ref: MyMemberPaymentBillResponse
