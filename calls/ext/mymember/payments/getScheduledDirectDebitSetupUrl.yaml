kind: ext-action
method: POST
path: /ext/mymember/payments/
action: getScheduledDirectDebitSetupUrl
summary: Get the direct debit setup URL for a schedule
description: "Card and direct debit set-up is a two-step flow: `getScheduledDirectDebitSetupUrl` returns the gateway URL (GoCardless) or client secret (Stripe), then `checkStatusOfDirectDebitSetup` (GoCardless, polled) or `completePaymentAuthorisation` (Stripe) finishes it."
tags: [ Parent Portal ]
source:
  request: inferred
  response: inferred
body:
  params:
    member_id:
      type: string
    section_id:
      type: string
    schedule_id:
      type: string
    payment_id:
      type: string
  example:
    member_id: "3100001"
    section_id: "45001"
    schedule_id: "6200001"
    payment_id: "6300001"
response:
  schema:
    $ref: MyMemberPaymentSetupResponse
  examples:
    setupGoCardless:
      summary: "`getScheduledDirectDebitSetupUrl` for a GoCardless scheme"
      value:
        status: true
        error: null
        data:
          url: "https://pay.gocardless.com/flow/example"
          key: example-setup-key
    setupStripe:
      summary: "`getScheduledDirectDebitSetupUrl` for a Stripe scheme"
      value:
        status: true
        error: null
        data:
          key: example-setup-key
          authorisation_data:
            public_key: pk_example
            client_secret: seti_example_secret
sources: [ ext.mymember.eb573b16408e09aef101.js ]
