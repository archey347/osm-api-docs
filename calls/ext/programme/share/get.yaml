kind: ext-action
method: GET
path: /ext/programme/share/
action: get
summary: Get the pending shared programme
description: "The receiving section reads it with `get` and then POSTs `accept` or `reject`."
tags: [ Programme ]
source:
  request: inferred
  response: inferred
query:
  sectionid:
    type: string
    required: true
    description: "Section ID. The sending section for `share`, the receiving one for `get`."
response:
  schema:
    $ref: ProgrammeShareSummary
  examples:
