kind: ext-action
method: GET
path: /ext/programme/share/
action: share
summary: Share a term's programme with another section
notes: "`share` sends a term's programme to another section the user has a role in, and is a GET despite changing data."
tags: [ Programme ]
source:
  request: inferred
  response: inferred
query:
  sectionid:
    type: string
    required: true
    description: "Section ID. The sending section for `share`, the receiving one for `get`."
  termid:
    type: string
  target:
    type: string
    description: Receiving section ID.
response:
  schema:
    $ref: ProgrammeShareResult
  examples:
    share:
      summary: "`share`; on failure `ok` is not 1 and `error` is set"
      value:
        ok: 1
        config: { }
