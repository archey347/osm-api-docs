  response: inferred
body:
  params:
    sectionid:
      type: string
      required: true
    section:
      type: string
      description: "Section type, e.g. `scouts`. Not sent by `acceptLists`/`rejectLists`."
    listid:
      type: string
      description: "Omit on `saveListDetails` to create a list."
    "itemrowidentifiers[]":
      type: array
      items:
        type: string
  example:
    section: scouts
    sectionid: "3100001"
    listid: "7100001"
    "itemrowidentifiers[]": [ "7300001" ]
response:
  schema:
    $ref: QuartermasterActionResponse
  envelope: true
