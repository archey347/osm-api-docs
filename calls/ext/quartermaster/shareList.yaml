kind: ext-action
method: POST
path: /ext/quartermaster/
action: shareList
summary: Share a list with other sections
description: "`shareList` takes one `section[<sectionid>]` field per target section."
tags: [ Quartermaster ]
source:
  request: inferred
  response: inferred
body:
  params:
    sectionid:
      type: string
      required: true
    section:
      type: string
      description: "Section type, e.g. `scouts`. Not sent by `acceptLists`/`rejectLists`."
    listid:
      type: string
      description: "Omit on `saveListDetails` to create a list."
    "section[{sectionId}]":
      type: string
      description: "Access for that section, `no-access` when not shared."
  example:
    section: scouts
    sectionid: "3100001"
    listid: "7100001"
    "section[3100002]": read
response:
  schema:
    $ref: QuartermasterActionResponse
  envelope: true
sources: [ ext.quartermaster.595dcb7d4cb2b5ff49ee.js ]
