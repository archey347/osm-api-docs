kind: ext-action
method: POST
path: /ext/quartermaster/
action: updateListItemColumnValue
summary: Update one value in a list item
tags: [ Quartermaster ]
source:
  request: inferred
  response: inferred
body:
  params:
    sectionid:
      type: string
      required: true
    section:
      type: string
      description: "Section type, e.g. `scouts`. Not sent by `acceptLists`/`rejectLists`."
    listid:
      type: string
      description: "Omit on `saveListDetails` to create a list."
    itemrowidentifier:
      type: string
    columnid:
      type: string
    value:
      type: string
  example:
    section: scouts
    sectionid: "3100001"
    listid: "7100001"
    itemrowidentifier: "7300001"
    columnid: "7200002"
    value: "5"
response:
  schema:
    $ref: QuartermasterActionResponse
  envelope: true
sources: [ ext.quartermaster.595dcb7d4cb2b5ff49ee.js ]
