tags: [ Reports ]
source:
  request: inferred
  response: inferred
query:
  section_id:
    type: string
    description: The other actions take it in the body.
  dashboard_id:
    type: string
    description: The other actions take it in the body.
body:
  params:
    confirmation:
      type: string
      description: "`remove` deletes it for every section, `orphan` leaves other sections their copy."
  example: { }
response:
