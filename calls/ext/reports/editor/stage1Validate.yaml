kind: ext-action
method: POST
path: /ext/reports/editor/
action: stage1Validate
summary: Submit report editor step 1
tags: [ Reports ]
source:
  request: inferred
  response: inferred
body:
  params:
    section_id:
      type: string
      required: true
    dashboard_id:
      type: string
      required: true
    report_id:
      type: string
      required: true
      description: "`0` when creating a report."
    context:
      type: string
      description: Report type.
    visualiser:
      type: string
      description: Output type.
  example:
    section_id: "45001"
    dashboard_id: "910100"
    report_id: "0"
    context: members
    visualiser: DataGrid
response:
  schema:
    $ref: ReportEditorResponse
  envelope: true
