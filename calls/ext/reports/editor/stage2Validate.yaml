kind: ext-action
method: POST
path: /ext/reports/editor/
action: stage2Validate
summary: Submit report editor step 2
tags: [ Reports ]
source:
  request: inferred
  response: inferred
body:
  params:
    section_id:
      type: string
      required: true
    dashboard_id:
      type: string
      required: true
    report_id:
      type: string
      required: true
      description: "`0` when creating a report."
    field:
      type: string
      description: "`-1` when no columns are chosen; otherwise nested form fields keyed by column."
    distinct_only:
      type: string
  example:
    section_id: "45001"
    dashboard_id: "910100"
    report_id: "0"
response:
  schema:
    $ref: ReportEditorResponse
  envelope: true
