kind: ext-action
method: POST
path: /ext/reports/sharing/
action: stopSharing
summary: Stop sharing a report
tags: [ Reports ]
source:
  request: inferred
  response: inferred
body:
  params:
    section_id:
      type: string
      required: true
    report_id:
      type: string
    confirmation:
      type: string
      description: "`remove` or `orphan`."
  example:
    section_id: "45001"
    report_id: "910001"
response:
  schema:
    $ref: ReportDeleteResultData
  envelope: true
  examples:
    stopSharing:
      summary: "`shared: true` means confirmation is needed"
      value:
        shared: false
