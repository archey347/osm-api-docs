kind: ext-action
method: GET
path: /ext/risk_assessments/
action: getHazards
summary: List hazards
description: "`getCategories`, `getHazards` and `getHarms` read the prepopulated hazard library used when the site's `risk_assessments_config.mode` is `prepopulated`."
tags: [ Risk Assessments ]
source:
  request: inferred
  response: inferred
query:
  section_id:
    type: string
    description: Section ID.
  type:
    type: string
    description: "Kind of thing assessed. Observed `meeting`, `activity`, `programmes_at_home`. `getHazards` defaults to `setup`."
  associated_id:
    type: string
    description: "ID of the meeting, activity or event. `0` when listing another section's assessments for reuse."
  category_id:
    type: string
response:
  schema:
    $ref: RiskAssessmentCategoriesData
  envelope: true
  examples:
    getHazards:
      summary: "`getHazards`"
      value:
        - hazard_id: "21"
          hazard: Slips and trips
          harm: Injury
          risk: low
          controls: Keep walkways clear.
sources: [ ext.risk_assessments.25831d7610fb31450e26.js, osm-de353b59e43da8164ac0b179aadfacd1.js ]
