kind: ext-action
method: GET
path: /ext/risk_assessments/
action: getRiskAssessment
summary: Get risk assessments
tags: [ Risk Assessments ]
source:
  request: observed
  response: observed
  observed_on: 2026-10-07
query:
  section_id:
    type: string
    description: Section ID.
  type:
    type: string
    description: "Kind of thing assessed. Observed `meeting`, `activity`, `programmes_at_home`. `getHazards` defaults to `setup`."
  associated_id:
    type: string
    description: "ID of the meeting, activity or event. `0` when listing another section's assessments for reuse."
response:
  schema:
    $ref: RiskAssessmentListData
  envelope: true
  examples:
    getRiskAssessment:
      summary: "`getRiskAssessment` and `getOtherAssessments`"
      value:
        - id: "6100001"
          section_id: "45001"
          associated_id: "9500001"
          type: meeting
          category_id: "0"
          manual_category: Equipment
          manual_hazard: Trip hazard from ropes
          controls: Keep ropes coiled when not in use.
          check: Leader checks the area before the session.
          duplicated_from_id: null
          hub_managed: false
sources: [ ext.risk_assessments.25831d7610fb31450e26.js ]
