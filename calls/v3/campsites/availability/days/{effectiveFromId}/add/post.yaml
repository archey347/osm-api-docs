summary: Add a unavailable-days rule
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  effectiveFromId:
    type: string
    description: Rule set (changeover date) ID.
body:
  params:
    day:
      type: integer
      required: true
      description: Day of week, 1 to 7.
    unavailable_from:
      type: string
      required: true
      description: "Time, `HH:MM`."
    unavailable_to:
      type: string
      required: true
      description: "Time, `HH:MM`."
  example:
    day: 5
    unavailable_from: "00:00"
    unavailable_to: "12:00"
response:
  schema:
    $ref: CampsiteResponse
  examples:
    default:
      value: [ ]
  description: Result envelope.
