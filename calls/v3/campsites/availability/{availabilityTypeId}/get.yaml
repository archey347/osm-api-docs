kind: v3-route
method: GET
path: "/v3/campsites/availability/{availabilityTypeId}"
summary: Get an availability type
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  availabilityTypeId:
    type: string
    description: Availability type ID.
response:
  schema:
    $ref: CampsiteAvailabilityType
  examples:
    default:
      value:
        id: 7400001
