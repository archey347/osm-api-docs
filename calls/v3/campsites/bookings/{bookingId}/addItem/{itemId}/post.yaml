kind: v3-route
method: POST
path: "/v3/campsites/bookings/{bookingId}/addItem/{itemId}"
summary: Add an item to a booking
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  bookingId:
    type: string
    description: Booking ID.
  itemId:
    type: string
    description: Bookable item ID.
body:
  params:
    slot_id:
      type: integer
      required: true
      description: "Slot `id` from the item availability."
    start:
      type: string
      required: true
      description: Date.
    end:
      type: string
      required: true
      description: "Date; same as `start` for single-day slots."
    number_people:
      type: integer
      required: true
    start_time:
      type: string
      description: Flexible-time slots only.
    end_time:
      type: string
      description: Flexible-time slots only.
    ignore_availability_rules:
      type: string
      enum: [ "1" ]
      description: Staff only.
  example:
    slot_id: 8100001
    start: "2026-08-01"
    end: "2026-08-03"
    number_people: 23
response:
  schema:
    $ref: CampsiteResponse
  examples:
    default:
      value:
        id: 7600001
        item_name: Field 1
        questions: 0
  description: "`data.questions` is the number of booking questions to ask, with `data.id` and `data.item_name` identifying the booked item."
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
