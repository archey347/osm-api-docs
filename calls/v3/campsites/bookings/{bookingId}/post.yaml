kind: v3-route
method: POST
path: "/v3/campsites/bookings/{bookingId}"
summary: Change a booking field
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  bookingId:
    type: string
    description: Booking ID.
body:
  params:
    field:
      type: string
      enum:
        - group_name
        - start_date
        - end_date
        - number_leaders
        - number_participants
        - campsite_organisation_id
        - member_id
        - status
        - pay_now
        - authorise_payments
        - ignore_deposit
      required: true
      description: Field to change.
    value:
      type: string
      description: "`status` takes `next`, `next-staff`, `confirmed`, `requires-deposit`, `rejected` or `terms_and_conditions_agreed`. `pay_now` and `authorise_payments` take an amount; `ignore_deposit` takes none."
    card_id:
      type: string
      description: "Saved card to charge, with `pay_now` and `authorise_payments`."
    force:
      type: integer
      description: "Resend with `1` after a `confirm_deletions` result."
    member_id:
      type: integer
      description: "Sent with `field=status` and `value=next`/`next-staff` to set the customer."
  example:
    field: group_name
    value: Example Scout Group
response:
  schema:
    $ref: CampsiteBookingChange
  examples:
    default:
      value: { }
  description: "Result envelope. `data.result` is `confirm_deletions` when the change would remove booked items; `data.client_secret` is returned for card payments."
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
