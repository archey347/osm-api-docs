kind: v3-route
method: POST
path: "/v3/campsites/items/{itemId}"
summary: Change an item field
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  itemId:
    type: string
    description: Bookable item ID.
body:
  params:
    field:
      type: string
      enum:
        - name
        - quantity
        - parent_id
        - campsite_session_id
        - campsite_price_type_id
        - min_people
        - max_people
        - hide_externally
        - staff_only
        - description
        - instructions
        - terms_and_conditions
        - campsite_instructor_type_id
        - number_instructors
        - number_participants
        - minimum_instructors
      required: true
      description: Setting to change.
    value:
      type: string
      required: true
      description: "`hide_externally` is `0` to hide, `1` to show; `staff_only` is `1` or `0`."
  example:
    field: max_people
    value: "60"
response:
  schema:
    $ref: CampsiteResponse
  examples:
    default:
      value: [ ]
  description: Result envelope.
