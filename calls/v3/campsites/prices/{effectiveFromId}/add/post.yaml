kind: v3-route
method: POST
path: "/v3/campsites/prices/{effectiveFromId}/add"
summary: Add a price to a changeover set
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  effectiveFromId:
    type: string
    description: Rule set (changeover date) ID.
body:
  params:
    organisation_id:
      type: integer
      required: true
      description: "Customer type; only when adding."
    price_per_person:
      type: number
      required: true
    price_per_session:
      type: number
      required: true
    free_people_per_session:
      type: integer
      required: true
    minimum_price:
      type: number
      required: true
      description: Needs a per-person or per-session price.
    deposit_amount:
      type: number
      required: true
    deposit_percent:
      type: number
      required: true
      description: "0 to 100."
  example:
    organisation_id: 7200001
    price_per_person: 5
    price_per_session: 0
    free_people_per_session: 0
    minimum_price: 0
    deposit_amount: 0
    deposit_percent: 25
response:
  schema:
    $ref: CampsiteResponse
  examples:
    default:
      value: [ ]
  description: Result envelope.
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
