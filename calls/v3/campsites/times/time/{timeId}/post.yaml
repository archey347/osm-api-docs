kind: v3-route
method: POST
path: "/v3/campsites/times/time/{timeId}"
summary: Edit a session time slot
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  timeId:
    type: string
    description: Time slot ID.
body:
  params:
    start_time:
      type: string
      required: true
      description: "`HH:MM`."
    end_time:
      type: string
      required: true
      description: "`HH:MM`."
    multi_day:
      type: string
      description: "Sent as `true` for overnight slots."
    flexible_times:
      type: string
      description: "Sent as `true` when customers pick their own times."
    flexible_minimum_duration:
      type: integer
      description: "Minutes; `0` unless `flexible_times`."
    flexible_changeover_time:
      type: integer
      description: "Minutes, `-1` blocks the changeover; `0` unless `flexible_times`."
    flexible_price_mode:
      type: string
      enum: [ hourly, session ]
    campsite_price_type_id:
      type: integer
      required: true
      description: "Price override; `0` for none."
    "day[1][min]":
      type: integer
      description: "Multi-day minimum sessions for Monday. `day[2]` to `day[7]` and `[max]` follow the same pattern."
  example:
    start_time: "14:00"
    end_time: "11:00"
    multi_day: "true"
    flexible_minimum_duration: 0
    flexible_changeover_time: 0
    flexible_price_mode: session
    campsite_price_type_id: 0
response:
  schema:
    $ref: CampsiteResponse
  examples:
    default:
      value: [ ]
  description: Result envelope.
sources: [ osm-de353b59e43da8164ac0b179aadfacd1.js ]
