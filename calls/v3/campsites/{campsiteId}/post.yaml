kind: v3-route
method: POST
path: "/v3/campsites/{campsiteId}"
summary: Update a campsite setting
tags: [ Campsites ]
source:
  request: inferred
  response: inferred
path_params:
  campsiteId:
    type: string
    description: Campsite ID.
body:
  params:
    field:
      type: string
      enum:
        - slug
        - requires_approval
        - show_availability_external_website
        - deposit_due_days
        - missed_deposit
        - welcome_email
        - email_when_staff_submitted
        - allow_instructor_sign_up
        - location
      required: true
      description: Setting to change.
    value:
      type: string
      description: "New value. Not used by `location`."
    "value[latitude]":
      type: number
      description: "With `field=location`."
    "value[longitude]":
      type: number
      description: "With `field=location`."
  example:
    field: requires_approval
    value: "true"
response:
  schema:
    $ref: CampsiteResponse
  examples:
    default:
      value: [ ]
  description: Result envelope.
