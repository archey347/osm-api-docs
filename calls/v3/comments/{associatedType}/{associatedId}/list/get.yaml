kind: v3-route
method: GET
path: "/v3/comments/{associatedType}/{associatedId}/list"
summary: List comments on a record
tags: [ Comments ]
source:
  request: inferred
  response: inferred
path_params:
  associatedType:
    type: string
    description: "Kind of record, e.g. `member`, `event`, `meeting`, `task`, `form_completion`, `chat_topic`."
  associatedId:
    type: string
query:
  section_id:
    type: string
    required: true
  limit:
    type: integer
response:
