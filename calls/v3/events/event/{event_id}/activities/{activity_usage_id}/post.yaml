kind: v3-route
method: POST
path: "/v3/events/event/{event_id}/activities/{activity_usage_id}"
summary: Update notes on a linked activity
tags: [ Events ]
source:
  request: inferred
  response: inferred
path_params:
  event_id:
    type: string
  activity_usage_id:
    type: string
    description: "ID of the activity link (`id` in the activities list), not the activity."
body:
  params:
    notes:
      type: string
      required: true
      description: Up to 240 characters.
  example:
    notes: Bring spare batteries
response:
  schema:
    $ref: EventPayloadData
  description: "Notes saved; the app ignores the body."
