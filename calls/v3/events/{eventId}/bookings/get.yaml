kind: v3-route
method: GET
path: "/v3/events/{eventId}/bookings"
summary: List campsite bookings for an event
tags: [ Generic ]
source:
  request: observed
  response: observed
  observed_on: 2026-10-05
path_params:
  eventId:
    type: string
response:
  schema:
    $ref: EventBookings
  examples:
    default:
      value:
        bookings:
          - booking_id: 5500001
            campsite: { }
  description: "The event and its bookings; the web app drops bookings with a null `campsite`."
