kind: v3-route
method: POST
path: "/v3/finances/accounting/bank_account/{bankAccountId}/import/summary"
summary: Preview a CSV import
tags: [ Accounting ]
source:
  request: inferred
  response: inferred
path_params:
  bankAccountId:
    type: string
    description: Bank account ID.
body:
  params:
    csv_layout:
      type: string
      required: true
      description: "JSON-encoded column mapping array (each entry has `target_field`)."
  example:
    csv_layout: "[{\"target_field\":\"date\"}]"
response:
  schema:
    $ref: AccountingResponse
  examples:
    default:
      value:
        rows: 3
  description: "Import summary; on failure `error.message` is shown."
sources: [ area.finances_accounting.d777bc5d449d2323971a.js ]
