kind: v3-route
method: POST
path: "/v3/group_hub/workspaces/{workspaceId}/badge_stock/share"
summary: Share badge stock with a section
tags: [ Group Hub ]
source:
  request: inferred
  response: inferred
path_params:
  workspaceId:
    type: string
    description: Group Hub workspace ID.
body:
  params:
    owning_section_id:
      type: string
      required: true
      description: Section that holds the stock.
    target_section_id:
      type: string
      required: true
      description: "Section that will use the owner's stock; one call per target."
    badges:
      type: array
      items:
        type: object
        properties:
          badge_id:
            type: string
          level:
            type: string
      required: true
  example:
    owning_section_id: "45001"
    target_section_id: "45002"
    badges:
      - badge_id: "1593"
        level: "1"
response:
  description: Success. The web app ignores the body.
sources: [ area.group_hub.87ce6caf70ff9fb3d1d1.js ]
