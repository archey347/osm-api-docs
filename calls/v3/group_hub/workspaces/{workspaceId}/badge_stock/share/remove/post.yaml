kind: v3-route
method: POST
path: "/v3/group_hub/workspaces/{workspaceId}/badge_stock/share/remove"
summary: Stop sharing badge stock with a section
tags: [ Group Hub ]
source:
  request: inferred
  response: inferred
path_params:
  workspaceId:
    type: string
    description: Group Hub workspace ID.
body:
  params:
    owning_section_id:
      type: string
      required: true
    section_id:
      type: string
      required: true
      description: Section that stops using the owner's stock.
    badge_id:
      type: string
      required: true
    level:
      type: string
      required: true
  example:
    owning_section_id: "45001"
    section_id: "45002"
    badge_id: "1593"
    level: "1"
response:
  description: Success. The web app ignores the body.
sources: [ area.group_hub.87ce6caf70ff9fb3d1d1.js ]
