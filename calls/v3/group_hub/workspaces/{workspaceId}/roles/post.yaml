kind: v3-route
method: POST
path: "/v3/group_hub/workspaces/{workspaceId}/roles"
summary: Set a user's group-wide permissions
tags: [ Group Hub ]
source:
  request: inferred
  response: inferred
path_params:
  workspaceId:
    type: string
    description: Group Hub workspace ID.
body:
  params:
    user_id:
      type: string
      required: true
    permissions:
      type: string
      required: true
      description: "JSON object of permission type to level (e.g. `user`, `finance`). Types set to 0 are left out."
  example:
    user_id: "100001"
    permissions: "{\"user\":20,\"finance\":10}"
response:
  description: Success. The web app ignores the body.
sources: [ area.group_hub.87ce6caf70ff9fb3d1d1.js ]
