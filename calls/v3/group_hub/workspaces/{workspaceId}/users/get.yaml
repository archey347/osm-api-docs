kind: v3-route
method: GET
path: "/v3/group_hub/workspaces/{workspaceId}/users"
summary: List users with access across the workspace
tags: [ Group Hub ]
source:
  request: inferred
  response: inferred
path_params:
  workspaceId:
    type: string
    description: Group Hub workspace ID.
response:
  schema:
    $ref: GroupHubUsers
  examples:
    default:
      value:
        users:
          - userid: 100001
            firstname: Alex
            email: "alex@example.com"
            pic: null
            grant:
              permissions:
                user: 20
            sections:
              - section_id: 45001
                name: Cubs
                is_admin: true
                permissions:
                  user: 100
  description: Users with section and group-wide access.
sources: [ area.group_hub.87ce6caf70ff9fb3d1d1.js ]
