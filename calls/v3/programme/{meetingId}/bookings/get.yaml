kind: v3-route
method: GET
path: "/v3/programme/{meetingId}/bookings"
summary: List campsite bookings for a meeting
tags: [ Generic ]
source:
  request: inferred
  response: inferred
path_params:
  meetingId:
    type: string
response:
  schema:
    $ref: GenericBookingsResponse
  examples:
    default:
      value:
        bookings:
          - booking_id: 5500001
            campsite: { }
  description: "Bookings; the web app drops those with a null `campsite`."
