kind: v3-route
method: POST
path: "/v3/settings/chatrooms/chatroom/{roomId}"
summary: Update a chat room
tags: [ Settings ]
source:
  request: inferred
  response: inferred
path_params:
  roomId:
    type: string
body:
  params:
    name:
      type: string
      description: At least 3 characters.
    mode:
      type: string
    use_titles:
      type: string
      enum: [ "true", "false" ]
    uploads:
      type: string
      enum: [ "true", "false" ]
    polls:
      type: string
      enum: [ "true", "false" ]
    retention_days:
      type: string
    audience_type:
      type: string
      description: "`patrol` or `portal`; other values were not captured."
    "patrol[n]":
      type: string
      description: "Patrol ID for the nth selected patrol, when `audience_type` is `patrol`."
  example:
    name: Example room
    mode: example
    use_titles: "false"
    uploads: "true"
    polls: "false"
    retention_days: "30"
    audience_type: portal
response:
  schema:
    $ref: SettingsStatusResponseData
  description: Response body is not read by the web app.
sources: [ "8913.6d746d696f1aeb9d4b5a.js" ]
