kind: v3-route
method: POST
path: "/v3/settings/chatrooms/chatroom/{roomId}/sharing"
summary: Share a chat room with other sections
tags: [ Settings ]
source:
  request: inferred
  response: inferred
path_params:
  roomId:
    type: string
body:
  params:
    section_id:
      type: string
      required: true
      description: Owning section.
    "share[sectionId]":
      type: string
      enum: [ "true", "false" ]
      description: One entry per other section the user can manage.
  example:
    section_id: "45001"
    "share[45002]": "true"
response:
  schema:
    $ref: SettingsStatusResponseData
  description: Response body is not read by the web app.
sources: [ "8913.6d746d696f1aeb9d4b5a.js" ]
