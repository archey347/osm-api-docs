kind: v3-route
method: POST
path: "/v3/todo/tasks/{taskId}"
summary: Update a task
description: "Only the fields sent are changed; the web app sends just `status` for drag-and-drop and just `owners` for self-assign."
tags: [ Todo ]
source:
  request: inferred
  response: inferred
path_params:
  taskId:
    type: string
query:
  section_id:
    type: string
    description: Sent by the board's quick actions, omitted by the edit dialog.
body:
  params:
    title:
      type: string
    description:
      type: string
    status:
      type: string
      enum: [ scheduled, ready, in_progress, completed ]
      description: "`scheduled` needs `available_date`, which must be in the future and not after `due_date`."
    due_date:
      type: string
      nullable: true
      description: "`YYYY-MM-DD`."
    available_date:
      type: string
      nullable: true
      description: "`YYYY-MM-DD`."
    repeat_frequency:
      type: integer
      description: "`0` for no repeat."
    repeat_period:
      type: string
      nullable: true
      enum: [ days, weeks, months ]
    owners:
      type: array
      items:
        type: integer
      description: "User IDs; `[0]` clears the assignees."
  example:
    status: in_progress
response:
  description: "Success. The web app ignores the body; validation failures carry `errors` keyed by field name."
sources: [ ext.todo.d468071aea6cfcdf2819.js ]
