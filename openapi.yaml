              additionalProperties: true
            dojo:
              type: object
              properties:
                cacheBust:
                  type: string
                locale:
                  type: string
              additionalProperties: true
          additionalProperties: true
        meta:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
