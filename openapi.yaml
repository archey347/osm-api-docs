  /ext/customdata/:
    get:
      summary: Get custom data for a member
      tags:
        - Custom Data
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getData ]
        - name: section_id
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: associated_id
          in: query
          required: true
          schema:
            type: string
          description: Member ID.
        - name: associated_type
          in: query
          required: true
          schema:
            type: string
            enum: [ member ]
        - name: associated_is_section
          in: query
          required: false
          schema:
            nullable: true
            type: string
          description: Section association flag (observed null).
        - name: varname_filter
          in: query
          required: false
          schema:
            nullable: true
            type: string
          description: Filter by variable name (observed null).
        - name: context
          in: query
          required: true
          schema:
            type: string
            enum: [ members ]
        - name: group_order
          in: query
          required: false
          schema:
            type: string
          description: Group ordering (observed "section").
      responses:
        "200":
          description: Custom data groups and columns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDataResponse"
              example:
                status: true
                error: null
                data:
                  - group_id: 7
                    group_type: "floating"
                    identifier: "floating"
                    name: "Other"
                    columns:
                      - column_id: 34
                        type: "select"
                        varname: "gender"
                        label: "Gender"
                        value: "Male"
                meta:
                  group_name: "1st Riverside Scouts"
                  section_name: "Cubs"
    post:
      summary: Update custom data for a member
      tags:
        - Custom Data
      description: |
        Updates custom data fields on a member. Two `action` values are supported:

        - `update` — bulk update using `data[field]=value` pairs (e.g. contact details).
        - `updateColumn` — update a single custom data column by `column_id`.

        Column IDs are section-specific. The only well-known core column is
        `column_id=34` for Gender (values: Male, Female, Self-identify,
        Prefer not to say, Other, Unspecified). Other column IDs vary per
        section — inspect HTTP traffic to discover them.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ update, updateColumn ]
        - name: section_id
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                associated_id:
                  type: string
                  description: Member scout ID.
                associated_type:
                  type: string
                  enum: [ member ]
                associated_is_section:
                  type: string
                  description: Section association flag (observed `false`).
                group_id:
                  type: string
                  description: |
                    Custom data group ID. For `update` action this matches
                    the contact group (1–6). For `updateColumn` this is the
                    custom data group containing the column.
                column_id:
                  type: integer
                  description: Column ID to update (`updateColumn` action only).
                value:
                  type: string
                  description: New value for the column (`updateColumn` action only).
                context:
                  type: string
                  enum: [ members ]
            examples:
              bulkUpdate:
                summary: Bulk update contact details (action=update)
                value:
                  associated_id: "3100003"
                  associated_type: "member"
                  group_id: "2"
                  context: "members"
                  service: "desktop"
                  "data[firstname]": "Helen"
                  "data[lastname]": "Park"
              updateColumn:
                summary: Update a single custom column (action=updateColumn)
                value:
                  associated_type: member
                  associated_id: "3100005"
                  associated_is_section: "false"
                  group_id: "7"
                  column_id: 34
                  value: "Male"
                  context: members
      responses:
        "200":
          description: Custom data update response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CustomDataUpdateResponse"
                  - $ref: "#/components/schemas/CustomDataColumnUpdateResponse"
              examples:
                bulkUpdate:
                  summary: Bulk update response
                  value:
                    status: true
                    error: null
                    data:
                      lastname: "Park"
                    meta:
                      last_updated:
                        last_updated: "2025-09-12 18:30:45"
                        last_updated_by_name: "Alex Scout"
                      updated:
                        lastname: "Last Name"
                columnUpdate:
                  summary: Column update response
                  value:
                    status: true
                    error: null
                    data:
                      column_id: 34
                      type: select
                      required: "no"
                      varname: gender
                      label: Gender
                      value: Male
                      is_core: "yes"
                      order: "12"
                    meta:
                      last_updated:
                        last_updated: "2025-09-15 19:43:22"
                        last_updated_by_name: "Alex Scout"
  /ext/audittrail/:
    post:
      summary: Get audit trail for a member
      tags:
        - Members
      description: |
        Returns the audit trail (change history) for a member. Despite being
        a POST, this is a read-only query — the body specifies which member
        to look up. The response contains a chronological list of changes
        including patrol moves, rank promotions, field edits, and section
        additions.

        Each entry has a `type` and `code` describing the kind of change:

        | type | code | Meaning |
        |------|------|---------|
        | `members` | `add` | Member added to section |
        | `details` | `field` | A member field was edited |
        | `details` | `new` | A new detail was added (e.g. consent) |
        | `patrols` | `add-to` | Member added to a patrol/six |
        | `patrol-leader` | `promoted` | Rank promotion or demotion |

        The `summary` field contains HTML with `<strong>` tags highlighting
        names, fields, and values.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getAuditTrail ]
          description: Must be `getAuditTrail`.
        - name: section_id
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - section_id
                - id
                - type
              properties:
                section_id:
                  type: string
                  description: Section ID (repeated in body).
                id:
                  type: string
                  description: Member scout ID.
                type:
                  type: string
                  enum: [ member ]
                  description: Must be `member`.
            example:
              section_id: "45001"
              id: "3100001"
              type: member
      responses:
        "200":
          description: Audit trail entries for the member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrailResponse"
              example:
                status: true
                error: null
                data:
                  - date: "15/09/2025 19:42"
                    date_raw: "2025-09-15 19:42:10"
                    summary: "<strong>Jamie River</strong> has had their <strong>Consents: Photographs</strong> added as <strong>Yes</strong> by <strong>Alex Scout</strong>"
                    verbose: ""
                    type: details
                    code: new
                    hidden: false
                  - date: "15/09/2025 19:38"
                    date_raw: "2025-09-15 19:38:31"
                    summary: "<strong>Jamie River</strong> is now a <strong>Sixer</strong> in the Blue six in <strong>Cubs</strong> (previously <strong>Seconder</strong>), changed by <strong>Alex Scout</strong>."
                    verbose: ""
                    type: patrol-leader
                    code: promoted
                    hidden: false
                  - date: "15/09/2025 19:37"
                    date_raw: "2025-09-15 19:37:04"
                    summary: "<strong>Jamie River</strong> was added to the <strong>Blue</strong> six."
                    verbose: ""
                    type: patrols
                    code: add-to
                    hidden: false
                  - date: "15/09/2025 19:35"
                    date_raw: "2025-09-15 19:35:54"
                    summary: "<strong>Alex Scout</strong> updated <strong>Date of Birth</strong> for <strong>Jamie River</strong> from <strong>22/04/2015</strong> to <strong>23/04/2015</strong>"
                    verbose: ""
                    type: details
                    code: field
                    hidden: false
                  - date: "15/09/2025 19:34"
                    date_raw: "2025-09-15 19:34:07"
                    summary: "<strong>Jamie River</strong> has been added to <strong>1st Riverside Scouts: Cubs</strong> by <strong>Alex Scout</strong>."
                    verbose: ""
                    type: members
                    code: add
                    hidden: false
                meta:
                  hidden: false
                  note_types:
                    - notes
                    - received-email
                    - received-phonecall
                    - received-letter
                    - sent-email
                    - sent-phonecall
                    - sent-letter
  /ext/settings/emails/:
    get:
      summary: Get email configuration for a section
      tags:
        - Email
      description: |
        Returns the email/newsletter configuration for a section, including
        available events and patrols that can be used as recipient filters
        when composing emails. Also indicates whether the section has a
        newsletter slug configured and if it is live.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getConfig ]
          description: Must be `getConfig`.
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
      responses:
        "200":
          description: Email configuration with events and patrols.
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  result:
                    type: object
                    properties:
                      sectionid:
                        type: string
                      slug:
                        type: string
                        description: Newsletter slug for the section.
                      numemails:
                        type: string
                        description: Number of emails sent (as string).
                      live:
                        type: string
                        enum: [ "0", "1" ]
                        description: Whether the newsletter is live.
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
                    description: Upcoming events that can be used as email filters.
                  patrols:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
                    description: Patrols/sixes in the section.
                  leaders:
                    type: boolean
                    description: Whether leaders are available as recipients.
                additionalProperties: true
              example:
                found: true
                result:
                  sectionid: "45001"
                  slug: "1stRiversideCubs"
                  numemails: "0"
                  live: "1"
                events:
                  - name: "Summer Camp 2025"
                    slug: "SummerCamp2025"
                  - name: "Investiture Ceremony"
                    slug: "InvestitureCeremony"
                patrols:
                  - name: "Blue"
                    slug: "Blue"
                  - name: "Green"
                    slug: "Green"
                  - name: "Red"
                    slug: "Red"
                  - name: "Yellow"
                    slug: "Yellow"
                leaders: true
  /v3/members/contact/{sectionid}/removalWarnings:
    post:
      summary: Get pre-removal warnings for a member
      tags:
        - Members
      description: |
        Checks whether there are any warnings before removing a member from a
        section (e.g. outstanding payments). Call this before `removeMember`
        to display confirmation prompts to the user.
      parameters:
        - name: sectionid
          in: path
          required: true
          schema:
            type: string
          description: Section ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - "member_ids[0]"
              properties:
                "member_ids[0]":
                  type: integer
                  description: Scout ID of the member to check. Additional members can be sent as `member_ids[1]`, `member_ids[2]`, etc.
            example:
              "member_ids[0]": 3100005
      responses:
        "200":
          description: Removal warnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  error:
                    nullable: true
                  data:
                    type: object
                    properties:
                      payments:
                        type: boolean
                        description: Whether the member has outstanding payments.
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      ok:
                        type: boolean
              example:
                status: true
                error: null
                data:
                  payments: false
                meta:
                  ok: true
