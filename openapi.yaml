  /ext/programme/:
    get:
      summary: Programme endpoints
      tags:
        - Programme
      description: |
        Programme endpoints share this path with different `action` values.
        Use `getProgrammeSummary` for term overview, `getProgramme` for details,
        `getMembersForParentRota` for parent rota members, or
        `programmeAttachmentsManifest` for attachment metadata.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                getProgrammeSummary,
                getProgramme,
                programmeAttachmentsManifest,
                getMembersForParentRota,
              ]
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: false
          schema:
            type: string
          description: Term ID.
        - name: eveningid
          in: query
          required: false
          schema:
            type: string
          description: Meeting ID.
        - name: section_id
          in: query
          required: false
          schema:
            type: string
          description: Section ID.
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Meeting ID.
        - name: evening_id
          in: query
          required: false
          schema:
            type: string
          description: Meeting ID.
        - name: verbose
          in: query
          required: false
          schema:
            type: string
          description: Return verbose programme summary (observed `1`).
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Unknown (observed `/`).
        - name: temp
          in: query
          required: false
          schema:
            type: string
          description: Unknown (observed `false`).
        - name: upload_mode
          in: query
          required: false
          schema:
            type: string
          description: Unknown (observed `programme`).
      responses:
        "200":
          description: Programme response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProgrammeSummary"
                  - $ref: "#/components/schemas/ProgrammeDetails"
                  - $ref: "#/components/schemas/ProgrammeParentRotaMembers"
                additionalProperties: true
              examples:
                programmeSummary:
                  summary: Programme summary
                  value:
                    items:
                      - eveningid: "9500001"
                        sectionid: "45001"
                        title: "Camp Skills Night"
                        notesforparents: "Bring a warm coat."
                        parentsrequired: "1"
                        meetingdate: "2024-11-01"
                        starttime: "18:00:00"
                        endtime: "19:30:00"
                        soft_deleted: "0"
                programmeDetails:
                  summary: Programme details
                  value:
                    items:
                      - eveningid: "9500001"
                        sectionid: "45001"
                        title: "Camp Skills Night"
                        meetingdate: "2024-11-01"
                        starttime: "18:00:00"
                        endtime: "19:30:00"
                        help:
                          - scoutid: "3100005"
                            scout: "Taylor Wood"
                    badgelinks: {}
                programmeParentRotaMembers:
                  summary: Parent rota members
                  value:
                    status: true
                    error: null
                    data:
                      - scoutid: "2015779"
                        firstname: "Robert"
                        lastname: "Baden Powell"
                        photo_guid: "00000000-0000-0000-0000-000000000000"
                        patrol_id: -2
                    meta: []
    post:
      summary: Update programme meeting parts
      tags:
        - Programme
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [editEveningParts]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                sectionid:
                  type: string
                eveningid:
                  type: string
                parts:
                  type: string
                  description: JSON object of fields to update (e.g., title, notesforparents, primary_leader_id).
              required: [sectionid, eveningid, parts]
              additionalProperties: true
            example:
              sectionid: "45998"
              eveningid: "9464403"
