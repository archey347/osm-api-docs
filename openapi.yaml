components:
  schemas:
    StartupConfigPayload:
      type: object
      properties:
        status:
          type: boolean
        error:
          nullable: true
        data:
          type: object
          properties:
            site_type:
              type: string
              description: Site variant identifier (e.g., `scouts`).
            site_folder:
              type: string
              description: Server-side folder path for site-specific assets.
            siteConfig:
              type: object
              description: Global feature flags, upgrade pricing, section type definitions, and configuration.
              properties:
                expense_cards:
                  type: object
                  additionalProperties: true
                online_payment_gateways:
                  type: array
                  items:
                    type: string
                beta:
                  type: array
                  description: Beta features available for opt-in.
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      role:
                        type: string
                      release_ts:
                        type: integer
                      feedback:
                        type: object
                        additionalProperties: true
                    additionalProperties: true
                boltons:
                  type: object
                  description: Short-code to bolton name mapping.
                  additionalProperties:
                    type: string
                upgrade_config:
                  type: object
                  description: Subscription feature prices, keyed by feature name.
                  additionalProperties:
                    type: object
                    properties:
                      price:
                        type: number
                sms_prices:
                  type: object
                  description: SMS bundle prices keyed by credit quantity.
                  additionalProperties:
                    type: number
                recipes:
                  type: object
                  description: Enumerated values for the recipe planner.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                section_types:
                  type: object
                  description: Human-readable section type names keyed by country code then section type slug.
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                badge_types:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                section_type_setup:
                  type: object
                  description: Per-section-type capability flags and badge definitions.
                  additionalProperties:
                    type: object
                    additionalProperties: true
                kill:
                  type: object
                  description: Feature kill-switch states (all `false` means all services active).
                  additionalProperties:
                    type: boolean
                buy_links:
                  type: object
                  additionalProperties:
                    type: string
                risk_assessments_config:
                  type: object
                  additionalProperties: true
                communicatable_contact_groups:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                email_template_colours:
                  type: array
                  items:
                    type: string
                campaign_template_designs:
                  type: array
                  items:
                    type: string
                remove_member_allowed_functions:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
              additionalProperties: true
            patrolLabels:
              type: object
              description: Patrol/group label names per section type.
              additionalProperties:
                type: object
                properties:
                  patrol:
                    type: string
                  patrols:
                    type: string
            patrolRoles:
              type: object
              description: |
                Patrol role definitions per section type. Youth sections use an array ordered by level;
                adult sections use an object keyed by level number.
              additionalProperties:
                oneOf:
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
                  - type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
            extraSectionTypes:
              type: object
              description: Display names for non-standard section types.
              additionalProperties:
                type: string
            featurelevels:
              type: object
              description: Minimum subscription level required to access each feature.
              additionalProperties:
                type: integer
            changedlevels:
              type: array
              items:
                type: object
                additionalProperties: true
            availableRoles:
              type: object
              description: Global role slugs mapped to display names.
              additionalProperties:
                type: string
            globalAccessRoles:
              type: array
              description: Access control rules granting global roles specific access types.
              items:
                type: object
                properties:
                  user_role:
                    type: string
                  access_type:
                    type: string
                  id:
                    type: string
                additionalProperties: true
            terminology:
              type: object
              description: Hierarchy level names for the site (Group, District, County, etc.).
              additionalProperties:
                type: string
            forms:
              type: array
              description: Dynamic form definitions (accident forms, medication history, etc.).
              items:
                type: object
                additionalProperties: true
            default_terminology:
              type: object
              additionalProperties:
                type: string
            leaderPatrolIds:
              type: array
              description: Patrol IDs reserved for leaders (typically -2 and -3).
              items:
                type: integer
          additionalProperties: true
        meta:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    StartupDataPayload:
      type: object
      properties:
        status:
          type: boolean
        error:
          nullable: true
        data:
          type: object
          properties:
            cdn:
              type: string
              description: Base CDN URL for static assets.
            resources:
              type: array
              items:
                type: string
              description: Ordered list of JS/CSS resource paths to load on startup.
            config_hash:
              type: string
              description: Hash representing the current server-side configuration state.
            required_cdn_built_files:
              type: object
              additionalProperties:
                type: string
              description: Named CDN file URLs required for the app (e.g., `osm.js`, `react.js`).
            cache_bust:
              type: string
              description: Query string cache-busting token derived from built file hashes.
            globals:
              type: object
              properties:
                post_login_action:
                  description: Action to perform after login, or `false` if none.
                  oneOf:
                    - type: boolean
                    - type: string
                theme:
                  type: string
                  description: UI theme name (e.g., `blue`).
                userid:
                  type: integer
                  description: Authenticated user's numeric ID.
                roles:
                  type: array
                  description: Sections the user has access to, including permissions and config.
