      responses:
        "200":
          description: Updated programme meeting details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammeDetails"
              example:
                items:
                  - eveningid: "9464403"
                    sectionid: "45998"
                    title: "Astronomy Night"
                    meetingdate: "2026-01-21"
                    starttime: "17:30:00"
                    endtime: "18:45:00"
                badgelinks: []
