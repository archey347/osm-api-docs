                    type: object
                    properties:
                      groupname:
                        type: string
                      groupid:
                        type: string
                      group_country:
                        type: string
                      sectionid:
                        type: string
                      sectionname:
                        type: string
                      section:
                        type: string
                        description: Section type slug (e.g., `cubs`, `scouts`, `adults`, `waiting`).
                      isDefault:
                        type: string
                      permissions:
                        type: object
                        additionalProperties: true
                      sectionConfig:
                        type: object
                        additionalProperties: true
                    additionalProperties: true
                active_user_member:
                  description: Whether the user is also a member record, or `false`.
                  oneOf:
                    - type: boolean
                    - type: integer
                associated_member_id:
                  description: Associated member ID if applicable, or `false`.
                  oneOf:
                    - type: boolean
                    - type: integer
                email:
                  type: string
                firstname:
                  type: string
                lastname:
                  type: string
                fullname:
                  type: string
                preferences:
                  type: object
                  additionalProperties: true
                  description: User-specific UI and behavioural preferences.
