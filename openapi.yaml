                          type: boolean
                      additionalProperties: true
                  description: Terms for each section, keyed by section ID.
                global_roles:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                hasSectionAccess:
                  type: boolean
                notepads:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                sockets:
                  type: string
