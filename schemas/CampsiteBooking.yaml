type: object
properties:
  id:
    type: integer
  status:
    type: string
    description: "One of `draft`, `provisional`, `requires-deposit`, `paying-deposit`, `confirmed`, `cancelled`."
  group_name:
    type: string
  start_date:
    type: string
  end_date:
    type: string
  number_leaders: { }
  number_participants: { }
  member_id: { }
  campsite_organisation_id: { }
  campsite:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      currency:
        type: string
    additionalProperties: true
  items:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          description: Booking item ID.
        item:
          type: object
          properties:
            name:
              type: string
          additionalProperties: true
        start_timestamp:
          type: string
        end_timestamp:
          type: string
        number_people: { }
        number_instructors: { }
        number_instructors_required: { }
        number_instructors_required_override:
          description: Null when not overridden.
        campsite_instructor_type_id: { }
        calculated_price: { }
        calculated_deposit: { }
        booking_questions:
          type: array
          items:
            type: object
            properties:
              answer:
                type: string
            additionalProperties: true
      additionalProperties: true
  payments:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
        paid_at:
          type: string
        type:
          type: string
        payment_method:
          type: string
        details:
          type: string
        amount: { }
      additionalProperties: true
  adjustments:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
        details:
          type: string
        amount: { }
      additionalProperties: true
  total_price: { }
  total_paid: { }
  deposit: { }
  remaining_deposit: { }
  deposit_due: { }
  card_payments_config:
    type: object
    properties:
      approved: { }
      charged: { }
    additionalProperties: true
  terms_and_conditions: { }
  formatted_created_at:
    type: string
additionalProperties: true
description: A booking with its items, payments and adjustments.
