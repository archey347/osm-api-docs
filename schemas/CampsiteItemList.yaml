type: array
items:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string
    parent_id:
      type: integer
      description: "`0` for top-level items."
    quantity:
      type: integer
      description: "`0` means the item is not bookable."
    session:
      nullable: true
      type: object
      properties:
        name:
          type: string
      additionalProperties: true
    price:
      nullable: true
      type: object
      properties:
        name:
          type: string
      additionalProperties: true
    available:
      type: boolean
      description: "With `mode=booking`."
    available_dates:
      description: "`false`, or an array of `{start, end, available, unavailable_reason}` ranges (`mode=diary`)."
    bookings:
      type: array
      description: "With `mode=diary`."
      items:
        type: object
        properties:
          id:
            type: integer
          start_timestamp:
            type: string
          end_timestamp:
            type: string
          booking:
            type: object
            properties:
              id:
                type: integer
              group_name:
                type: string
              status:
                type: string
            additionalProperties: true
        additionalProperties: true
    description:
      type: string
    instructions:
      type: string
    terms_and_conditions:
      type: string
    pictures:
      type: array
      items:
        type: object
        additionalProperties: true
  additionalProperties: true
description: "Bookable items (a flat list; nesting is via `parent_id`)."
