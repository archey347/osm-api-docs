type: object
description: |-
  Shared upload-widget response (config, manifest, upload results).
properties:
  status:
    type: boolean
  error:
    description: May be null.
  data:
    type: object
    properties:
      config:
        type: object
        description: Widget limits and the action names for file get/delete.
        additionalProperties: true
      manifest:
        type: object
        description: Files in the folder.
        additionalProperties: true
    additionalProperties: true
  meta:
    type: object
    properties:
      size:
        type: object
        description: Remaining storage quota.
        additionalProperties: true
    additionalProperties: true
additionalProperties: true
