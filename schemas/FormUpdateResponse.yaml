  form_id:
    type: integer
  section_id:
    type: integer
  title:
    type: string
  associated_type:
    type: string
    nullable: true
  associated_id:
    type: string
    nullable: true
  state:
    type: string
    nullable: true
  delete_at:
    type: string
    nullable: true
  created_by:
    type: object
    nullable: true
    additionalProperties: true
  created_at:
